port: 7880
bind_addresses:
  - 0.0.0.0
key_file: /run/secrets/livekit-keys.yaml

logging:
  level: warn
  pion_level: error
  json: false

room:
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 8
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

turn:
  enabled: true
  # Caddy owns TCP 443; embedded TURN owns UDP 443. This deliberately trades
  # HTTP/3 for a firewall-friendly TURN/UDP relay on the common HTTPS port.
  udp_port: 443
