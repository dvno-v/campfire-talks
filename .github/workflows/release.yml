name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild pinned media client
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- static/voice.js static/livekit-e2ee-worker.js
      - name: Require tag to match Campfire version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from campfire import __version__
          expected = f"v{__version__}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag must be {expected}")
          PY
      - name: Test release commit
        run: python -m unittest discover -s tests -v
      - name: Build reproducible source archive and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="campfire-${RELEASE_TAG}/" \
            --output="dist/campfire-${RELEASE_TAG}.tar.gz" HEAD
          cd dist
          sha256sum "campfire-${RELEASE_TAG}.tar.gz" > SHA256SUMS
      - name: Sign provenance for every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
