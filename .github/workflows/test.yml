name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild pinned media client
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- static/voice.js static/livekit-e2ee-worker.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate private defaults
        run: python -m campfire check-config
      - name: Build container
        run: docker build --tag campfire:test .
      - name: Check Compose model
        env:
          CAMPFIRE_DOMAIN: chat.example.net
          CAMPFIRE_MEDIA_DOMAIN: media.example.net
        run: docker compose config --quiet
